<style>
:root{--bg:#1b2833;--sf:#243441;--ln:#3b5060;--tx:#f0f4f5;--mu:#9db1bd;--ac:#e6ab5a;font-family:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 55% at 85% -8%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 70%),var(--bg)}

#pin:focus{border-color:var(--ac);outline:none}
.lk label{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#1b2630;font-weight:700;border-radius:12px;padding:11px 24px}
</style></head>

const $=s=>document.querySelector(s),pi=$('#pin'),msg=t=>{$('#perr').textContent=t};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const dec=async k=>new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c)));
const write=h=>{document.open();document.write(h);document.close()};
const derive=async v=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])};
let busy=0;
async function go(){
 const v=pi.value;if(busy||v.length<D.n)return;busy=1;msg('Checking…');
 let k,h;try{k=await derive(v);h=await dec(k)}catch(e){msg('Wrong code, try again.');pi.value='';busy=0;return}
 if($('#rem').checked)ls.set('k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))));
 write(h);
}
(async()=>{
 if(!(window.crypto&&crypto.subtle)){$('#lock').hidden=false;msg('This page needs a secure (https) address.');return}
 const sk=ls.get('k');
 if(sk){try{write(await dec(await crypto.subtle.importKey('raw',b(sk),'AES-GCM',false,['decrypt'])));return}catch(e){ls.del('k')}}
 $('#lock').hidden=false;
})();
pi.addEventListener('input',()=>{pi.value=pi.value.replace(/\D/g,'').slice(0,D.n);msg('');go()});
$('#pgo').onclick=go;
})();
